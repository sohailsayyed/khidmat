services:
  khidmat:
    build: .
    expose:
      - "3000"
    env_file: .env.docker
    volumes:
      - khidmat_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - khidmat

volumes:
  khidmat_data:
  caddy_data:
  caddy_config:
